# SHARED (S-3, owner: Vincent). LocDrop on AWS: DynamoDB + Lambda + API Gateway (HTTP API) + web app hosting
# (S3 + CloudFront, or AWS Amplify Hosting where CloudFront isn't available).
# Deploy with: npm run deploy   (see docs/DEPLOY.md). Learner Lab: npm run deploy -- --learner-lab (us-east-1).
# The Lambda code is bundled into .aws-build/<Name>/ by `npm run build:lambdas` first.
# The local Express server (src/local) and the dev-only naive route are NOT deployed.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LocDrop (CSC4160) - location-based notes. Serverless backend + static web app.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  WebHosting:
    Type: String
    Default: cloudfront
    AllowedValues: [cloudfront, amplify, none]
    Description: >-
      How to host the web app (both give an HTTPS link, which phones need for GPS).
      cloudfront = private S3 bucket + CloudFront. amplify = AWS Amplify Hosting (use this in AWS Academy
      Learner Lab, which blocks CloudFront, or in a new account until AWS Support verifies it for CloudFront).
      none = API only.

Conditions:
  UseCloudFront: !Equals [!Ref WebHosting, cloudfront]
  UseAmplify: !Equals [!Ref WebHosting, amplify]
  HasWebsite: !Or [!Condition UseCloudFront, !Condition UseAmplify]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref NotesTable
        # Login-token secret lives in SSM Parameter Store (created once by the deploy script), never in git.
        JWT_SECRET: "{{resolve:ssm:/locdrop/prod/jwt-secret}}"

Resources:
  # ---------------------------------------------------------------- data
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "locdrop-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1 # geo: CELL#<geohash7>, active notes only
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2 # author: AUTHOR#<username>
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES # feeds NotifyFn (live pop-ups, A-10)
      TimeToLiveSpecification: # WebSocket connection items expire if $disconnect never arrives
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # "*" is safe here: the login token travels in the Authorization header (read only by our own app
        # from its own storage), never in cookies, so other sites can't act as a logged-in user.
        # It also covers the local dev server, phone mode, and whichever host serves the web app.
        # (Note: SAM silently drops CorsConfiguration if AllowOrigins uses Fn::If, so keep this a plain list.)
        AllowOrigins: ["*"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings: # caps cost if someone hammers the public URL
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # ---------------------------------------------------------------- functions (one per endpoint)
  RegisterFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/RegisterFn/
      MemorySize: 1024 # bcrypt hashing is CPU-heavy; more memory = more CPU on Lambda
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/register

  LoginFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/LoginFn/
      MemorySize: 1024
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/login

  MeFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/MeFn/
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /me

  GroupsCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/GroupsCreateFn/
      MemorySize: 256
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /groups

  GroupsJoinFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/GroupsJoinFn/
      MemorySize: 256
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /groups/join

  GroupsListFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/GroupsListFn/
      MemorySize: 256
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /groups

  NotesCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotesCreateFn/
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /notes

  NotesMineFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotesMineFn/
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /notes/mine

  NotesNearbyFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotesNearbyFn/
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /notes/nearby

  NotesOpenFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotesOpenFn/
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }] # first reader consumes the note
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /notes/{id}/open

  NotesRecallFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotesRecallFn/
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /notes/{id}

  # ---------------------------------------------------------------- live pop-ups (A-9, A-10)
  # WebSocket API: wss://<id>.execute-api.<region>.amazonaws.com/<Stage>?token=<login token>
  # The phone sends { "action": "location", ... }; NotifyFn pushes note_nearby / note_gone back.
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "locdrop-${Stage}-ws"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WsConnectFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/WsConnectFn/
      MemorySize: 256
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]

  WsDisconnectFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/WsDisconnectFn/
      MemorySize: 256
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]

  WsLocationFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/WsLocationFn/
      MemorySize: 256
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }]

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFn.Arn}/invocations"

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFn.Arn}/invocations"

  WsLocationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsLocationFn.Arn}/invocations"

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: NONE # the login token is checked inside WsConnectFn
      Target: !Sub "integrations/${WsConnectIntegration}"

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WsDisconnectIntegration}"

  WsLocationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: location
      Target: !Sub "integrations/${WsLocationIntegration}"

  # Messages with any other "action" have no route, so API Gateway drops them without calling Lambda.

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  WsLocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsLocationFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  # A WebSocket stage needs an explicit deployment. CloudFormation only re-creates a Deployment when its
  # logical id changes, so if you add or change a route later, bump the suffix (WsDeploymentV2, ...).
  WsDeploymentV1:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsLocationRoute]
    Properties:
      ApiId: !Ref WsApi

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref Stage
      DeploymentId: !Ref WsDeploymentV1
      DefaultRouteSettings: # caps cost if someone floods the socket
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  NotifyFn: # pushes pop-ups whenever a note appears or disappears (DynamoDB Stream)
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-build/NotifyFn/
      Timeout: 30
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}"
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref NotesTable } }, { Statement: [{ Effect: Allow, Action: "execute-api:ManageConnections", Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/${Stage}/POST/@connections/*" }] }]
      Events:
        NoteChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt NotesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumRetryAttempts: 2 # notify logs and skips its own errors; this only covers crashes
            FilterCriteria: # only note items; user, group and connection writes never wake it up
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"PK":{"S":[{"prefix":"NOTE#"}]}}}}'

  # ---------------------------------------------------------------- web app, option A: private S3 bucket behind CloudFront (HTTPS)
  WebBucket:
    Type: AWS::S3::Bucket
    Condition: UseCloudFront
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "locdrop-${Stage}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "LocDrop web app (${Stage})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # includes Asia edge locations (Hong Kong, Singapore, ...)
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed "CachingOptimized"
        CustomErrorResponses: # single-page app: unknown paths (e.g. /note/abc) serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  # ---------------------------------------------------------------- web app, option B: AWS Amplify Hosting (HTTPS)
  # Managed hosting (runs on CloudFront behind the scenes, managed by AWS). The deploy script uploads the
  # built web app as a zip ("manual deploy"), so no GitHub connection is needed.
  AmplifyApp:
    Type: AWS::Amplify::App
    Condition: UseAmplify
    Properties:
      Name: !Sub "locdrop-${Stage}"
      Description: LocDrop web app (CSC4160)
      Platform: WEB
      CustomRules:
        # Single-page app: any path that isn't a file (no .js/.css/.png/... extension), e.g. /login or
        # /note/abc, serves index.html with status 200. This is AWS's documented SPA rule; the simpler
        # "/<*> → /index.html (404-200)" rule left /login answering 301 → 404.
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
          Target: /index.html
          Status: "200"

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Condition: UseAmplify
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      Stage: PRODUCTION

Outputs:
  ApiUrl:
    Description: Base URL of the LocDrop API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  WsUrl:
    Description: WebSocket URL for live pop-ups (add ?token=<login token>)
    Value: !Sub "wss://${WsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}"
  WebHosting:
    Value: !Ref WebHosting
  WebUrl:
    Condition: HasWebsite
    Description: The live web app (open this on any phone)
    Value: !If
      - UseCloudFront
      - !Sub "https://${WebDistribution.DomainName}"
      - !Sub "https://main.${AmplifyApp.DefaultDomain}"
  AmplifyAppId:
    Condition: UseAmplify
    Value: !GetAtt AmplifyApp.AppId
  WebBucketName:
    Condition: UseCloudFront
    Value: !Ref WebBucket
  DistributionId:
    Condition: UseCloudFront
    Value: !Ref WebDistribution
  TableName:
    Value: !Ref NotesTable
